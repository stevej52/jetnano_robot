# Nav2 for the jetnano: a 1/10 four-wheel-steering rock crawler.
#
# WHY THIS IS NOT THE DEFAULT NAV2 CONFIG
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Nav2's out-of-the-box setup assumes a differential-drive robot that can spin
# on the spot. This one cannot: it steers. Two consequences drive every choice
# below.
#
#   Planner:    Smac Hybrid-A*, not NavFn. NavFn happily plans paths with
#               zero-radius turns that a steering robot physically cannot
#               follow, and the controller then thrashes trying.
#   Controller: Regulated Pure Pursuit with use_rotate_to_heading FALSE.
#               Rotating to heading is exactly the manoeuvre this chassis
#               cannot perform.
#
# MEASURE ME: minimum_turning_radius. With the tape-measured 0.330 m
# wheelbase and both axles steering to 30 degrees, geometry gives
# (wheelbase/2)/tan(30) = 0.29 m, so the 0.30 m below is barely a margin.
# Drive a full-lock circle on the floor before trusting it - tyre scrub on a
# crawler makes the real number larger than the geometry says, and a radius
# set too small plans turns the robot cannot make.

amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: scan
    laser_model_type: likelihood_field
    max_particles: 2000
    min_particles: 500
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    tf_broadcast: true
    update_min_a: 0.2
    update_min_d: 0.1

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    # Nav2's stock trees recover by spinning; this crawler cannot, and
    # behavior_server has no spin plugin, so bt_navigator would refuse to load
    # them. These are the same trees minus Spin. __BT_DIR__ is replaced with
    # this package's share/behavior_trees by navigation.launch.py.
    default_nav_to_pose_bt_xml: "__BT_DIR__/navigate_to_pose_no_spin.xml"
    default_nav_through_poses_bt_xml: "__BT_DIR__/navigate_through_poses_no_spin.xml"

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.20
      # Generous: a steering robot cannot fine-tune its final heading on the
      # spot, so demanding a tight yaw tolerance makes it shuffle forever.
      yaw_goal_tolerance: 0.50

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.45
      lookahead_dist: 0.45
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.80
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.2
      transform_tolerance: 0.2

      # The whole point: this chassis steers, it does not pivot.
      use_rotate_to_heading: false
      allow_reversing: true          # the ESC has a reverse; use it

      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.30
      regulated_linear_scaling_min_speed: 0.15
      use_cost_regulated_linear_velocity_scaling: true
      max_angular_accel: 2.0
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.6

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # MEASURE ME: the real outline, x forward, y left. 0.40 x 0.18 m body.
      footprint: "[ [0.22, 0.11], [0.22, -0.11], [-0.22, -0.11], [-0.22, 0.11] ]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          obstacle_max_range: 8.0
      # What the camera sees in 3D: nvblox (on the GPU, in the isaac_vo
      # container) publishes a 2D occupancy grid of everything between 10 cm
      # and 35 cm above the floor - steps, low rocks and table edges the
      # lidar's single plane cannot see. A plain nav_msgs/OccupancyGrid in the
      # odom frame, so Nav2's own static layer reads it and no NVIDIA package
      # is needed on this side. Inert unless navigation.launch.py is started
      # with nvblox:=true, which inserts it into the plugin list above; the
      # nvblox node must be running (robot.launch.py nvblox:=true).
      nvblox_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: /nvblox_node/static_occupancy_grid
        map_subscribe_transient_local: false
        subscribe_to_updates: false
        track_unknown_space: false
        lethal_cost_threshold: 65
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[ [0.22, 0.11], [0.22, -0.11], [-0.22, -0.11], [-0.22, 0.11] ]"
      footprint_padding: 0.03
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          obstacle_max_range: 8.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.30
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 5.0
      motion_model_for_search: "REEDS_SHEPP"   # forward AND reverse
      angle_quantization_bins: 72
      minimum_turning_radius: 0.30             # MEASURE ME
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      analytic_expansion_ratio: 3.5
      smooth_path: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    cycle_frequency: 10.0
    # No Spin and no BackUp-to-rotate: this robot cannot turn on the spot.
    # Wait is kept because pausing for a moving obstacle is always valid.
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.50, 0.0, 3.0]
    min_velocity: [-0.30, 0.0, -3.0]
    max_accel: [1.0, 0.0, 3.0]
    max_decel: [-1.5, 0.0, -3.0]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1

# Last stop before twist_mux: slows or stops the smoothed command when the
# lidar sees something on a collision course. Jazzy's nav2_bringup always
# starts it; without this block its bringup aborts. Topic names are
# parameters here, and navigation.launch.py remaps cmd_vel_smoothed to
# cmd_vel_nav_smoothed so the monitor sits between the smoother and twist_mux
# instead of beside them.
collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_nav"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.15
      max_height: 2.0
      enabled: true

# The robot has no charging dock. This block exists only because Jazzy's
# nav2_bringup always starts the docking server and aborts the whole bringup
# when it has no dock plugin to load. A placeholder dock at the map origin
# that nothing ever asks to use.
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_footprint"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["placeholder_dock"]
    placeholder_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false
    docks: ["no_dock"]
    no_dock:
      type: "placeholder_dock"
      frame: map
      pose: [0.0, 0.0, 0.0]
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.10
      v_linear_max: 0.15

map_server:
  ros__parameters:
    yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
