# Nav2 for the jetnano: a 1/10 four-wheel-steering rock crawler.
#
# WHY THIS IS NOT THE DEFAULT NAV2 CONFIG
# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Nav2's out-of-the-box setup assumes a differential-drive robot that can spin
# on the spot. This one cannot: it steers. Two consequences drive every choice
# below.
#
#   Planner:    Smac Hybrid-A*, not NavFn. NavFn happily plans paths with
#               zero-radius turns that a steering robot physically cannot
#               follow, and the controller then thrashes trying.
#   Controller: Regulated Pure Pursuit with use_rotate_to_heading FALSE.
#               Rotating to heading is exactly the manoeuvre this chassis
#               cannot perform.
#
# MEASURE ME: minimum_turning_radius. With the tape-measured 0.330 m
# wheelbase and both axles steering to 30 degrees, geometry gives
# (wheelbase/2)/tan(30) = 0.29 m, so the 0.30 m below is barely a margin.
# Drive a full-lock circle on the floor before trusting it - tyre scrub on a
# crawler makes the real number larger than the geometry says, and a radius
# set too small plans turns the robot cannot make.

amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: scan
    laser_model_type: likelihood_field
    max_particles: 2000
    min_particles: 500
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    tf_broadcast: true
    update_min_a: 0.2
    update_min_d: 0.1

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    # ms between behaviour-tree ticks (stock 10). The tree only dispatches and watches - the
    # controller runs at its own 20 Hz - and every tick publishes navigate_to_pose feedback:
    # 63 a second on the 2026-09-28 drives, the biggest stream the recorder and a goal
    # client had to take in. 50 ms: 20 a second.
    bt_loop_duration: 50
    # ms. The stock 20 was too short on the loaded Jetson (2026-09-27): the BT gave up on a
    # goal the controller had already accepted, and the controller drove the path unsupervised.
    default_server_timeout: 200
    wait_for_service_timeout: 1000
    # Nav2's stock trees recover by spinning; this crawler cannot, and
    # behavior_server has no spin plugin, so bt_navigator would refuse to load
    # them. These are the same trees minus Spin. __BT_DIR__ is replaced with
    # this package's share/behavior_trees by navigation.launch.py.
    default_nav_to_pose_bt_xml: "__BT_DIR__/navigate_to_pose_no_spin.xml"
    default_nav_through_poses_bt_xml: "__BT_DIR__/navigate_through_poses_no_spin.xml"

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.10   # 2026-09-27: 0.20 stopped her 19 cm short every time; 0.10 -> 3-10 cm
      # Any heading: a steering robot cannot turn on the spot, so one that reaches the goal
      # pointing the wrong way shuffles there until the goal times out. 2026-09-29 (floor,
      # same 9-leg loop): at 0.50 rad a leg reached its spot 55-70 deg off and shuffled 100 s,
      # 111 direction changes; at 3.14 none did. Her heading still comes out roughly as
      # planned (the path ends pointing that way): 1-33 deg off on that drive.
      yaw_goal_tolerance: 3.14

    # MPPI with the Ackermann model, NOT IN USE (2026-10-04, drive 34): untuned it crept along
    # the hall at throttle 0.02 (2.8 m in 70 s) using half a core; the lap was stopped. Kept here
    # as FollowPathMPPI for a proper tuning session; to try it, swap its name with FollowPath.
    # Second try the same evening, forward only (vx_min 0): still median throttle 0.02, 0.10 m/s
    # over the first 8 s of a 4.6 m goal - the reverse samples were not the cause.
    FollowPathMPPI:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56              # x model_dt = 2.8 s ahead
      model_dt: 0.05              # = 1 / controller_frequency (20 Hz)
      batch_size: 1000            # 2000 is NVIDIA-desktop sized; the Orin's CPU runs this
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 0.36                # the same cruise as Pure Pursuit (desired_linear_vel)
      vx_min: 0.0                 # forward only: with -0.25 the forward and reverse samples averaged
                                  # out to throttle 0.02 (drive 34); Nav2 plans her reversals, not MPPI
      vy_max: 0.0
      wz_max: 1.2
      ax_max: 1.0
      ax_min: -1.5
      az_max: 3.0
      motion_model: "Ackermann"
      AckermannConstraints:
        min_turning_r: 0.40       # measured 2026-09-27 (0.33 right / 0.39 left); the planner uses 0.40
      prune_distance: 1.7
      transform_tolerance: 0.2
      retry_attempt_limit: 1
      enforce_path_inversion: true   # stop at a planned forward/reverse cusp instead of cutting it
      visualize: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic",
                "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0                   # forward preferred, reverse allowed
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.44          # 0.44 (+5 %) 2026-10-04 after drives 38-39 (86/88 s, clean), Steve; 0.30 from the first tests 2026-09-27; 0.36 after drive 25;
                                        # 0.40 (+10 %) after drives 31-33; 0.42 (+5 %) after drive 35
                                        # (71.5 s to the parking, clean), Steve 2026-10-04
      lookahead_dist: 0.45
      min_lookahead_dist: 0.50   # 2026-09-27: 0.25 flicked the steering near goals
      max_lookahead_dist: 0.80
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.5   # 2026-09-27: 1.2 s weaved +-12 deg on a long diagonal; 1.5 s tracked straight
      transform_tolerance: 0.2

      # The whole point: this chassis steers, it does not pivot.
      use_rotate_to_heading: false
      allow_reversing: true          # the ESC has a reverse; use it
      # RPP's own look-ahead collision check OFF (2026-10-05, Steve's explicit OK after the house-tour
      # simulator, tools/rosie_sim): it projects her path as if she could turn on the spot, so near a
      # wall it called "collision ahead" on moves the planner had checked for her real turning circle
      # and she froze (drive 36 at the kitchen cabinets). Still guarding her: the collision monitor
      # below (lidar + camera), collision_guard, and the planner's costmap.
      # Sim, 199 goals: failed 31 -> 22, clean 110 -> 132, wall bumps 0 -> 0.
      use_collision_detection: false

      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.30
      regulated_linear_scaling_min_speed: 0.18   # her crawl
      use_cost_regulated_linear_velocity_scaling: true
      max_angular_accel: 2.0
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.6

local_costmap:
  local_costmap:
    ros__parameters:
      # as often as the controller steers (20 Hz), so it never works from a map more than
      # 50 ms old; nvblox's grid comes at 40 Hz, the lidar at 7.9. Bench, no goal, nvblox
      # layer on (2026-09-27): whole navigation stack 111 % of a core at 5 Hz, 112 % at 10,
      # 114 % at 20, no missed-rate warnings
      update_frequency: 20.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # MEASURE ME: the real outline, x forward, y left. 0.40 x 0.18 m body.
      # tyre to tyre, tape-measured 2026-09-27 (Steve): 0.444 long x 0.295 wide - no bumpers
      # on a crawler, the tyres are the edges (was 0.44 x 0.22: 7.5 cm too narrow)
      footprint: "[ [0.222, 0.148], [0.222, -0.148], [-0.222, -0.148], [-0.222, 0.148] ]"
      footprint_padding: 0.03
      # Layers combine by maximum: the camera's layer can add obstacles, never erase the
      # lidar's. Nav2 reads use_maximum (and lethal_cost_threshold, track_unknown_space)
      # per costmap, not per layer, so until 2026-09-28 the nvblox layer's own lines were
      # ignored and it OVERWROTE the lidar's marks wherever the camera had mapped (its free
      # cells wiping chair legs the lidar saw). nvblox's grid is 0 / 100 / -1 only.
      use_maximum: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          obstacle_max_range: 8.0
      # What the camera sees in 3D: nvblox (on the GPU, in the isaac_vo
      # container) publishes a 2D occupancy grid of everything between 10 cm
      # and 35 cm above the floor - steps, low rocks and table edges the
      # lidar's single plane cannot see. A plain nav_msgs/OccupancyGrid in the
      # odom frame, so Nav2's own static layer reads it and no NVIDIA package
      # is needed on this side. Inert unless navigation.launch.py is started
      # with nvblox:=true, which inserts it into the plugin list above; the
      # nvblox node must be running (robot.launch.py nvblox:=true).
      nvblox_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: /nvblox_node/static_occupancy_grid
        map_subscribe_transient_local: false
        subscribe_to_updates: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Trimmed 2026-09-29 (Steve: the kitchen has two or three times the room she needs):
        # 0.35 / 3.0 -> 0.31 / 6.0 - the costly band ends 4 cm sooner and falls off twice as fast.
        # 0.31 is the least that keeps Smac's quick outline checks (her padded outline reaches
        # 0.309 m from the centre). Tested offline on the house map (tools/drive_analysis/
        # planner_margins.py): clear-floor routes unchanged; round the open dishwasher (the
        # camera's catch that blocked the kitchen leg on every loop that night) 7.8 -> 7.2 m,
        # 6 -> 4 direction changes. The 3 cm footprint_padding stays (tyres swing out at full
        # lock: the TV cabinet, 2026-09-28); the collision guard and monitor are unchanged.
        cost_scaling_factor: 10.0   # 6.0 until 2026-10-01: the cost falls off twice as fast, so the "expensive" band round furniture is half as wide
        inflation_radius: 0.31   # must stay >= the padded footprint's circumscribed radius (0.308): below it (0.22 and 0.28 tried 2026-10-01) Smac drops its optimised footprint check, plans 10x slower and timed out at the table corner (drive 19). The "danger zone" is cut by cost_scaling_factor instead.

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      # tyre to tyre, tape-measured 2026-09-27 (Steve): 0.444 long x 0.295 wide - no bumpers
      # on a crawler, the tyres are the edges (was 0.44 x 0.22: 7.5 cm too narrow)
      footprint: "[ [0.222, 0.148], [0.222, -0.148], [-0.222, -0.148], [-0.222, 0.148] ]"
      footprint_padding: 0.03
      # by maximum, as the local costmap: the camera layer only adds (see there)
      use_maximum: true
      # Drives 21-22 (2026-10-02): sunlight on the floor came out of the depth camera as
      # obstacle and closed the hall's end to the planner. The camera's cells now arrive in
      # /planner_map at 60 (grid_to_points planner_camera_value); trinary would drop anything
      # under lethal_cost_threshold (100) to FREE, so it is off and 60 becomes a cost of ~150:
      # the planner avoids them when it can, passes when it must. The lidar's own 100s stay
      # lethal; -1 stays unknown. A costmap-level parameter, like lethal_cost_threshold.
      trinary_costmap: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        # The house map. navigation.launch.py nvblox:=true swaps in /planner_map: the same
        # map with the camera's obstacles stamped on (grid_to_points), one grid - see below.
        map_topic: /map                          # PLANNER_MAP
        # Drives 21-22 (2026-10-02): sunlight on the floor came out of the depth camera as
        # obstacle and closed the hall's end to the planner. The camera's cells now arrive at
        # 60 (grid_to_points planner_camera_value), and this scales them to a cost instead of
        # dropping them to free (trinary): the planner avoids them when it can, passes when it
        # must. The lidar's own 100s stay lethal; -1 stays unknown.
        trinary_costmap: false
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          obstacle_max_range: 8.0
      # The camera's obstacles for the planner too (nvblox:=true). grid_to_points lays
      # nvblox's grid, which is in the odom frame, on /map's cells through SLAM's
      # map -> odom and stamps its obstacles onto /map, publishing the result as
      # /planner_map, which the static layer above then reads - boxes, bags, cushions
      # under the lidar's plane. 2026-09-28: without it the planner sent her through a
      # box and a floor cushion the controller could see and would not drive into, twice.
      # Until 2026-09-29 the camera grid was a second StaticLayer (camera_layer) here. Each
      # StaticLayer resizes the whole costmap to its own map: /map in localization grows
      # and shrinks by a few cells as scans are added, the camera's copy followed a moment
      # later, and each mismatch (58 in the hour) wiped the other layer until its next
      # message - at times the planner saw only camera blobs and no walls. And nvblox's
      # grid, built in a drifting odom frame over the whole session, had by then put old
      # obstacles in the wrong places (ghost walls; odom was 72 deg off the map). Now one
      # grid, nvblox keeps only what is within 3 m of her (cuvslam_nvblox_d435.launch.py
      # map_clearing_radius_m), and the heading no longer drifts that way (ekf.yaml imu0).
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Trimmed 2026-09-29 (Steve: the kitchen has two or three times the room she needs):
        # 0.35 / 3.0 -> 0.31 / 6.0 - the costly band ends 4 cm sooner and falls off twice as fast.
        # 0.31 is the least that keeps Smac's quick outline checks (her padded outline reaches
        # 0.309 m from the centre). Tested offline on the house map (tools/drive_analysis/
        # planner_margins.py): clear-floor routes unchanged; round the open dishwasher (the
        # camera's catch that blocked the kitchen leg on every loop that night) 7.8 -> 7.2 m,
        # 6 -> 4 direction changes. The 3 cm footprint_padding stays (tyres swing out at full
        # lock: the TV cabinet, 2026-09-28); the collision guard and monitor are unchanged.
        cost_scaling_factor: 10.0   # 6.0 until 2026-10-01: the cost falls off twice as fast, so the "expensive" band round furniture is half as wide
        inflation_radius: 0.31   # must stay >= the padded footprint's circumscribed radius (0.308): below it (0.22 and 0.28 tried 2026-10-01) Smac drops its optimised footprint check, plans 10x slower and timed out at the table corner (drive 19). The "danger zone" is cut by cost_scaling_factor instead.

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    # Two copies of the same planner. "GridBased" (the default, nav_goal / nav_park) plans to
    # the goal's exact heading. "Through" is for nav_route: on a route every intermediate
    # waypoint is a planner goal, and with an exact heading each one became a Reeds-Shepp
    # reverse-and-shuffle at the island's corners (drive 13, 2026-09-30: 73 s at one corner,
    # "detected collision ahead", route aborted). ALL_DIRECTION: a waypoint is passed facing
    # whichever way the path through it wants. nav_route picks it on the tree's
    # planner_selector topic and hands GridBased back afterwards.
    planner_plugins: ["GridBased", "Through"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.30
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 5.0
      motion_model_for_search: "REEDS_SHEPP"   # forward AND reverse
      angle_quantization_bins: 72
      minimum_turning_radius: 0.40             # measured 2026-09-27: 0.33 right / 0.39 left at full lock
      reverse_penalty: 2.0
      change_penalty: 0.0           # 1.5 tried 2026-09-29: worse (6 of 9, 288 s, 181 direction changes vs 8, 156 s, 20)
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      analytic_expansion_ratio: 3.5
      smooth_path: true
    Through:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.30
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 5.0
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      minimum_turning_radius: 0.40
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      analytic_expansion_ratio: 3.5
      smooth_path: true
      goal_heading_mode: "ALL_DIRECTION"       # the waypoint's heading is advice, not a constraint

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    cycle_frequency: 10.0
    # No Spin and no BackUp-to-rotate: this robot cannot turn on the spot.
    # Wait is kept because pausing for a moving obstacle is always valid.
    behavior_plugins: ["backup", "drive_on_heading", "wait"]
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.44, 0.0, 3.0]   # = the controller's cruise (0.35 had capped the 0.36 of drives 25-33)
    min_velocity: [-0.25, 0.0, -3.0]
    max_accel: [1.0, 0.0, 3.0]
    max_decel: [-1.5, 0.0, -3.0]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1

# Last stop before twist_mux: slows or stops the smoothed command when the
# lidar sees something on a collision course. Jazzy's nav2_bringup always
# starts it; without this block its bringup aborts. Topic names are
# parameters here, and navigation.launch.py remaps cmd_vel_smoothed to
# cmd_vel_nav_smoothed so the monitor sits between the smoother and twist_mux
# instead of beside them.
collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_nav_mps"   # -> nav_translator -> cmd_vel_nav (throttle, steering)
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    # Simulates her outline along the commanded motion and slows her so nothing is hit
    # within time_before_collision. Until 2026-09-28 it used the costmap footprint
    # (0.444 x 0.295, tyre to tyre with the wheels straight), looked 1.2 s ahead and saw
    # the lidar only, and it let her swing her nose into the TV cabinet: reversing at full
    # lock the turned front tyres stick out ~3.5 cm past that outline, she turned tighter
    # than commanded (0.32 m radius against the planner's 0.40), and the cabinet 10 cm off
    # her side was the camera's to see. Now: the outline with the tyres turned (plus a
    # centimetre), 1.5 s (1.2 x 0.40/0.32), and nvblox's obstacle points as well - the
    # whole grid it keeps, so what is beside her counts even when the camera looks ahead.
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      points: "[[0.26, 0.19], [0.26, -0.19], [-0.26, -0.19], [-0.26, 0.19]]"
      time_before_collision: 0.8   # 1.5 until 2026-10-05 (Steve OK): near walls it slowed her to nothing (sim: failed 22 -> 18, 0 bumps); 0.8 s at 0.44 m/s = 35 cm
      simulation_time_step: 0.1
      min_points: 4
      visualize: false
      enabled: true
    # navigation.launch.py nvblox:=true adds "camera": with no nvblox (the simulator) a
    # source that never arrives is "invalid" and the monitor would stop everything
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.15
      max_height: 2.0
      enabled: true
    camera:
      type: "pointcloud"
      topic: "/nvblox_node/obstacle_points"     # grid_to_points: nvblox's occupied cells at z 0.20
      min_height: 0.05
      max_height: 2.0
      enabled: true

# The robot has no charging dock. This block exists only because Jazzy's
# nav2_bringup always starts the docking server and aborts the whole bringup
# when it has no dock plugin to load. A placeholder dock at the map origin
# that nothing ever asks to use.
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_footprint"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["placeholder_dock"]
    placeholder_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false
    docks: ["no_dock"]
    no_dock:
      type: "placeholder_dock"
      frame: map
      pose: [0.0, 0.0, 0.0]
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.10
      v_linear_max: 0.15

map_server:
  ros__parameters:
    yaml_filename: ""

