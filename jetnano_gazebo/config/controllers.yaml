#
# Controllers for the simulated robot.
#
# Plain forward-command controllers, not ackermann_steering_controller: that
# one models a front-steering car with two steered wheels, which cannot
# express a chassis that steers all four. The kinematics live in steering.py
# instead, where they are unit-tested against closed-form geometry.
#
# Joint ORDER matters and must match drive_node.py. The controllers take a
# bare Float64MultiArray with no joint names in it, so a reordering here
# silently sends the front-left command to the rear-right wheel - the robot
# still drives, just wrongly. Both ends derive the order from one constant.

controller_manager:
  ros__parameters:
    update_rate: 100        # Hz, comfortably above the 30 Hz cmd_vel arrives at
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    steer_controller:
      type: position_controllers/JointGroupPositionController

    wheel_controller:
      type: velocity_controllers/JointGroupVelocityController

steer_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - front_left_steer_joint
      - front_right_steer_joint
      - rear_left_steer_joint
      - rear_right_steer_joint

wheel_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
