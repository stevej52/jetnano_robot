<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>jetnano</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #111; color: #ddd; font: 16px/1.3 system-ui, sans-serif;
               touch-action: manipulation; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  main { max-width: 640px; margin: 0 auto; padding: 8px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 6px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  #status { font-size: 14px; padding: 3px 10px; border-radius: 12px; background: #333; }
  #status.ok { background: #1d4d2a; }
  #status.driving { background: #1a4a7a; }
  #status.stopped { background: #7a1d1d; }
  #status.nolink { background: #5a4a10; }
  #video { display: block; width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 6px; object-fit: contain; }

  /* the stick: a circle you drag the knob around in */
  #stick { position: relative; width: min(72vw, 300px); aspect-ratio: 1; margin: 14px auto 6px; border-radius: 50%;
           background: radial-gradient(circle, #2b2b2b 0%, #1e1e1e 70%, #191919 100%); border: 2px solid #444;
           touch-action: none; cursor: grab; }
  #stick.off { opacity: 0.35; cursor: default; }
  #stick .axis { position: absolute; background: #3a3a3a; pointer-events: none; }
  #stick .axis.h { left: 8%; right: 8%; top: 50%; height: 1px; }
  #stick .axis.v { top: 8%; bottom: 8%; left: 50%; width: 1px; }
  #stick .label { position: absolute; font-size: 12px; color: #666; pointer-events: none; }
  #stick .label.n { top: 6px; left: 50%; transform: translateX(-50%); }
  #stick .label.s { bottom: 6px; left: 50%; transform: translateX(-50%); }
  #stick .label.w { left: 10px; top: 50%; transform: translateY(-50%); }
  #stick .label.e { right: 10px; top: 50%; transform: translateY(-50%); }
  #knob { position: absolute; width: 34%; height: 34%; left: 33%; top: 33%; border-radius: 50%;
          background: #3d7fd6; box-shadow: 0 2px 8px #000a; pointer-events: none; will-change: transform; }
  #knob.live { background: #5aa0ff; }
  #readout { text-align: center; font-variant-numeric: tabular-nums; color: #aaa; font-size: 14px; min-height: 1.3em; }

  button { font: inherit; }
  /* the emergency stop: the full width of the page, underneath everything, and
     it stays at the bottom of the screen when the page scrolls */
  #stop { display: block; width: 100%; height: 84px; margin: 14px 0 0; border: 0; border-radius: 12px;
          background: #b81f1f; color: #fff; font-size: 24px; font-weight: 800; letter-spacing: 2px; cursor: pointer;
          position: sticky; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -4px 16px #000c; }
  #stop.go { background: #1f8a3a; letter-spacing: 1px; }
  #stop:active { filter: brightness(1.25); }
  #speed { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
  #speed input { flex: 1; }
  #speed output { width: 3.5em; text-align: right; font-variant-numeric: tabular-nums; }
  footer { font-size: 12px; color: #777; padding: 10px 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>jetnano</h1>
    <span id="status">connecting</span>
  </header>

  <img id="video" alt="camera" draggable="false">

  <div id="stick">
    <div class="axis h"></div><div class="axis v"></div>
    <span class="label n">forward</span><span class="label s">back</span>
    <span class="label w">left</span><span class="label e">right</span>
    <div id="knob"></div>
  </div>
  <div id="readout">&nbsp;</div>

  <div id="speed">
    <span>speed limit</span>
    <input id="speedSlider" type="range" min="10" max="100" step="5" value="40">
    <output id="speedOut">40%</output>
  </div>

  <footer>Drag the knob: up and down is throttle, left and right is steering, further is more, and it
    springs back to nothing when you let go. Keyboard: arrows or WASD, space = emergency stop. Tap the picture if it freezes.</footer>

  <button id="stop" aria-label="emergency stop">EMERGENCY STOP</button>
</main>

<script>
(function () {
  'use strict';
  var status = document.getElementById('status');
  var video = document.getElementById('video');
  var stick = document.getElementById('stick');
  var knob = document.getElementById('knob');
  var readout = document.getElementById('readout');
  var stopBtn = document.getElementById('stop');
  var slider = document.getElementById('speedSlider');
  var speedOut = document.getElementById('speedOut');

  var DEAD = 0.08;          // fraction of travel around the centre that means "nothing"
  var EXPO = 0.25;          // softens the centre without losing the ends, like the joystick profiles

  var pointer = null;       // the pointerId holding the knob
  var stickVec = { x: 0, y: 0 };   // -1..1 each, from the knob; y is positive DOWN like the screen
  var keysDown = {};        // code -> true
  var wasSending = false;
  var eStop = false;
  var videoUrl = 'http://' + location.hostname + ':8080/stream?topic=/camera/color/image_raw';

  function post(path, body) {
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                         body: JSON.stringify(body || {}) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  function loadVideo() {
    video.src = videoUrl + '&t=' + Date.now();      // a new query defeats a stuck cached stream
  }
  video.addEventListener('error', function () { setTimeout(loadVideo, 2000); });
  video.addEventListener('click', loadVideo);

  // ------------------------------------------------------------- the stick --
  function travel() { return stick.clientWidth / 2 - knob.offsetWidth / 2; }

  function place(x, y) {
    var t = travel();
    knob.style.transform = 'translate(' + (x * t) + 'px,' + (y * t) + 'px)';
    knob.classList.toggle('live', x !== 0 || y !== 0);
  }

  function setFromEvent(e) {
    var r = stick.getBoundingClientRect();
    var t = travel();
    var x = (e.clientX - (r.left + r.width / 2)) / t;
    var y = (e.clientY - (r.top + r.height / 2)) / t;
    var m = Math.hypot(x, y);
    if (m > 1) { x /= m; y /= m; m = 1; }             // the knob stays inside the circle
    if (m < DEAD) { x = 0; y = 0; }
    else { var s = (m - DEAD) / (1 - DEAD) / m; x *= s; y *= s; }   // 0 at the edge of the dead zone
    stickVec = { x: x, y: y };
    place(x, y);
  }

  function letGo() {
    pointer = null;
    stickVec = { x: 0, y: 0 };
    place(0, 0);
  }

  stick.addEventListener('pointerdown', function (e) {
    if (eStop) return;
    e.preventDefault();
    pointer = e.pointerId;
    stick.setPointerCapture(e.pointerId);
    setFromEvent(e);
  });
  stick.addEventListener('pointermove', function (e) {
    if (e.pointerId === pointer) { e.preventDefault(); setFromEvent(e); }
  });
  function up(e) { if (e.pointerId === pointer) letGo(); }
  stick.addEventListener('pointerup', up);
  stick.addEventListener('pointercancel', up);
  stick.addEventListener('lostpointercapture', up);
  stick.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ------------------------------------------------------------ the command --
  function expo(v) { return v * (1 - EXPO) + v * v * v * EXPO; }

  function current() {
    var x = stickVec.x, y = stickVec.y;
    if (pointer === null) {                       // keyboard: full deflection per key
      x = (keysDown.ArrowRight || keysDown.KeyD ? 1 : 0) - (keysDown.ArrowLeft || keysDown.KeyA ? 1 : 0);
      y = (keysDown.ArrowDown || keysDown.KeyS ? 1 : 0) - (keysDown.ArrowUp || keysDown.KeyW ? 1 : 0);
      var m = Math.hypot(x, y);
      if (m > 1) { x /= m; y /= m; }
    }
    var speed = Number(slider.value) / 100;
    // Up on the screen is forward; right on the screen is a right turn (negative yaw).
    return { any: x !== 0 || y !== 0, lin: expo(-y) * speed, ang: expo(-x) };
  }

  function describe(c) {
    if (!c.any) return ' ';
    var th = Math.round(c.lin * 100), st = Math.round(c.ang * 100);
    return 'throttle ' + (th > 0 ? 'forward ' : th < 0 ? 'back ' : '') + Math.abs(th) + ' %  ·  steer '
      + (st > 0 ? 'left ' : st < 0 ? 'right ' : '') + Math.abs(st) + ' %';
  }

  function show(st) {
    if (st.e_stop) { status.textContent = 'STOPPED - press GO'; status.className = 'stopped'; }
    else if (st.driving) { status.textContent = 'driving'; status.className = 'driving'; }
    else { status.textContent = 'ready'; status.className = 'ok'; }
    eStop = !!st.e_stop;
    stopBtn.textContent = eStop ? 'STOPPED — TAP TO GO' : 'EMERGENCY STOP';
    stopBtn.classList.toggle('go', eStop);
    stick.classList.toggle('off', eStop);
  }

  function noLink() {
    status.textContent = 'no link to robot';
    status.className = 'nolink';
  }

  // Ten times a second while the knob or a key is held, once more with zeros on release.
  setInterval(function () {
    var c = current();
    readout.textContent = describe(c);
    if (c.any || wasSending) {
      wasSending = c.any;
      post('/cmd', { lin: c.any ? c.lin : 0, ang: c.any ? c.ang : 0 }).then(show).catch(noLink);
    }
  }, 100);

  // The status pill when idle.
  setInterval(function () {
    if (current().any) return;
    fetch('/status', { cache: 'no-store' })
      .then(function (r) { return r.json(); }).then(show).catch(noLink);
  }, 700);

  stopBtn.addEventListener('click', function () {
    letGo();
    keysDown = {};
    post(eStop ? '/go' : '/stop').then(show).catch(noLink);
  });

  // Anything that takes the page away lets go of everything.
  function dropAll() { letGo(); keysDown = {}; }
  window.addEventListener('blur', dropAll);
  document.addEventListener('visibilitychange', function () { if (document.hidden) dropAll(); });

  // ---------------------------------------------------------- the keyboard --
  var keyCodes = { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, KeyW: 1, KeyA: 1, KeyS: 1, KeyD: 1 };
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) stopBtn.click(); return; }
    if (e.code in keyCodes) { e.preventDefault(); if (!eStop) keysDown[e.code] = true; }
  });
  document.addEventListener('keyup', function (e) {
    if (e.code === 'Space') { e.preventDefault(); return; }   // no second click from a focused button
    if (e.code in keyCodes) { e.preventDefault(); delete keysDown[e.code]; }
  });

  slider.addEventListener('input', function () { speedOut.textContent = slider.value + '%'; });

  // ------------------------------------------------------------------ start --
  place(0, 0);
  fetch('/config', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (cfg) { if (cfg.video_url) videoUrl = cfg.video_url; })
    .catch(function () {})
    .then(loadVideo);
})();
</script>
</body>
</html>
