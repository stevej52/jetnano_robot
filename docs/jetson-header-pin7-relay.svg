<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1010" viewBox="0 0 820 1010" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="820" height="1010" fill="#ffffff"/>
  <text x="410" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#111">Jetson Orin Nano 40-pin header: where the relay goes</text>
  <text x="410" y="62" text-anchor="middle" font-size="15" fill="#444">Relay IN goes on PIN 7, the next pin after your servo board's I2C wires (pins 3 and 5), same row</text>

  <!-- header body -->
  <rect x="348" y="90" width="124" height="820" rx="10" fill="#1d1d1d"/>
  <text x="410" y="84" text-anchor="middle" font-size="13" fill="#555">odd pins          even pins</text>

  <!-- pin rows: y = 110 + (row)*40 ; odd pin x=370, even pin x=450 -->
  <g font-size="14">
    <!-- row 1 -->
    <rect x="357" y="97" width="26" height="26" fill="#f2a33a" stroke="#fff" stroke-width="2"/>
    <text x="370" y="115" text-anchor="middle" font-weight="700" fill="#111">1</text>
    <circle cx="450" cy="110" r="13" fill="#e0443e"/><text x="450" y="115" text-anchor="middle" fill="#fff" font-weight="700">2</text>
    <text x="334" y="115" text-anchor="end" fill="#b86b00">3.3 V  (square pad / "1" on the board)</text>
    <text x="486" y="115" fill="#c0302b">5 V</text>
    <!-- row 2 -->
    <circle cx="370" cy="150" r="13" fill="#2f6fd6"/><text x="370" y="155" text-anchor="middle" fill="#fff" font-weight="700">3</text>
    <circle cx="450" cy="150" r="13" fill="#e0443e"/><text x="450" y="155" text-anchor="middle" fill="#fff" font-weight="700">4</text>
    <text x="334" y="155" text-anchor="end" fill="#2f6fd6" font-weight="700">I2C SDA - servo board wire (already there)</text>
    <text x="486" y="155" fill="#c0302b">5 V</text>
    <!-- row 3 -->
    <circle cx="370" cy="190" r="13" fill="#2f6fd6"/><text x="370" y="195" text-anchor="middle" fill="#fff" font-weight="700">5</text>
    <circle cx="450" cy="190" r="13" fill="#444"/><text x="450" y="195" text-anchor="middle" fill="#fff" font-weight="700">6</text>
    <text x="334" y="195" text-anchor="end" fill="#2f6fd6" font-weight="700">I2C SCL - servo board wire (already there)</text>
    <text x="486" y="195" fill="#333">GND</text>
    <!-- row 4: PIN 7 -->
    <circle cx="370" cy="230" r="17" fill="#18a84a" stroke="#0b6b2c" stroke-width="3"/><text x="370" y="236" text-anchor="middle" fill="#fff" font-weight="800" font-size="17">7</text>
    <circle cx="450" cy="230" r="13" fill="#bbb"/><text x="450" y="235" text-anchor="middle" fill="#fff" font-weight="700">8</text>
    <text x="334" y="236" text-anchor="end" fill="#0b6b2c" font-weight="800" font-size="17">RELAY IN  ⟶  PIN 7 (GPIO09)</text>
    <text x="486" y="235" fill="#888">UART TX</text>
    <!-- row 5 -->
    <circle cx="370" cy="270" r="13" fill="#444"/><text x="370" y="275" text-anchor="middle" fill="#fff" font-weight="700">9</text>
    <circle cx="450" cy="270" r="13" fill="#bbb"/><text x="450" y="275" text-anchor="middle" fill="#fff" font-weight="700">10</text>
    <text x="334" y="275" text-anchor="end" fill="#333">GND</text>
    <text x="486" y="275" fill="#888">UART RX</text>
  </g>

  <!-- remaining rows, unused here -->
  <g font-size="13" fill="#888">
    <circle cx="370" cy="310" r="12" fill="#ddd"/><text x="370" y="314" text-anchor="middle" fill="#666">11</text><circle cx="450" cy="310" r="12" fill="#ddd"/><text x="450" y="314" text-anchor="middle" fill="#666">12</text>
    <text x="334" y="314" text-anchor="end">UART RTS</text><text x="486" y="314">I2S SCLK</text>
    <circle cx="370" cy="350" r="12" fill="#ddd"/><text x="370" y="354" text-anchor="middle" fill="#666">13</text><circle cx="450" cy="350" r="12" fill="#444"/><text x="450" y="354" text-anchor="middle" fill="#fff">14</text>
    <text x="334" y="354" text-anchor="end">SPI1 SCK</text><text x="486" y="354" fill="#333">GND</text>
    <circle cx="370" cy="390" r="12" fill="#ddd"/><text x="370" y="394" text-anchor="middle" fill="#666">15</text><circle cx="450" cy="390" r="12" fill="#ddd"/><text x="450" y="394" text-anchor="middle" fill="#666">16</text>
    <text x="334" y="394" text-anchor="end">GPIO12</text><text x="486" y="394">SPI1 CS1</text>
    <circle cx="370" cy="430" r="12" fill="#f2a33a"/><text x="370" y="434" text-anchor="middle" fill="#fff">17</text><circle cx="450" cy="430" r="12" fill="#ddd"/><text x="450" y="434" text-anchor="middle" fill="#666">18</text>
    <text x="334" y="434" text-anchor="end" fill="#b86b00">3.3 V</text><text x="486" y="434">SPI1 CS0</text>
    <circle cx="370" cy="470" r="12" fill="#ddd"/><text x="370" y="474" text-anchor="middle" fill="#666">19</text><circle cx="450" cy="470" r="12" fill="#444"/><text x="450" y="474" text-anchor="middle" fill="#fff">20</text>
    <text x="334" y="474" text-anchor="end">SPI0 MOSI</text><text x="486" y="474" fill="#333">GND</text>
    <circle cx="370" cy="510" r="12" fill="#ddd"/><text x="370" y="514" text-anchor="middle" fill="#666">21</text><circle cx="450" cy="510" r="12" fill="#ddd"/><text x="450" y="514" text-anchor="middle" fill="#666">22</text>
    <text x="334" y="514" text-anchor="end">SPI0 MISO</text><text x="486" y="514">SPI1 MISO</text>
    <circle cx="370" cy="550" r="12" fill="#ddd"/><text x="370" y="554" text-anchor="middle" fill="#666">23</text><circle cx="450" cy="550" r="12" fill="#ddd"/><text x="450" y="554" text-anchor="middle" fill="#666">24</text>
    <text x="334" y="554" text-anchor="end">SPI0 SCK</text><text x="486" y="554">SPI0 CS0</text>
    <circle cx="370" cy="590" r="12" fill="#444"/><text x="370" y="594" text-anchor="middle" fill="#fff">25</text><circle cx="450" cy="590" r="12" fill="#ddd"/><text x="450" y="594" text-anchor="middle" fill="#666">26</text>
    <text x="334" y="594" text-anchor="end" fill="#333">GND</text><text x="486" y="594">SPI0 CS1</text>
    <circle cx="370" cy="630" r="12" fill="#ddd"/><text x="370" y="634" text-anchor="middle" fill="#666">27</text><circle cx="450" cy="630" r="12" fill="#ddd"/><text x="450" y="634" text-anchor="middle" fill="#666">28</text>
    <text x="334" y="634" text-anchor="end">I2C0 SDA</text><text x="486" y="634">I2C0 SCL</text>
    <circle cx="370" cy="670" r="12" fill="#ddd"/><text x="370" y="674" text-anchor="middle" fill="#666">29</text><circle cx="450" cy="670" r="12" fill="#444"/><text x="450" y="674" text-anchor="middle" fill="#fff">30</text>
    <text x="334" y="674" text-anchor="end">GPIO01</text><text x="486" y="674" fill="#333">GND</text>
    <circle cx="370" cy="710" r="12" fill="#ddd"/><text x="370" y="714" text-anchor="middle" fill="#666">31</text><circle cx="450" cy="710" r="12" fill="#ddd"/><text x="450" y="714" text-anchor="middle" fill="#666">32</text>
    <text x="334" y="714" text-anchor="end">GPIO11</text><text x="486" y="714">GPIO07</text>
    <circle cx="370" cy="750" r="12" fill="#ddd"/><text x="370" y="754" text-anchor="middle" fill="#666">33</text><circle cx="450" cy="750" r="12" fill="#444"/><text x="450" y="754" text-anchor="middle" fill="#fff">34</text>
    <text x="334" y="754" text-anchor="end">GPIO13</text><text x="486" y="754" fill="#333">GND</text>
    <circle cx="370" cy="790" r="12" fill="#ddd"/><text x="370" y="794" text-anchor="middle" fill="#666">35</text><circle cx="450" cy="790" r="12" fill="#ddd"/><text x="450" y="794" text-anchor="middle" fill="#666">36</text>
    <text x="334" y="794" text-anchor="end">I2S FS</text><text x="486" y="794">UART CTS</text>
    <circle cx="370" cy="830" r="12" fill="#ddd"/><text x="370" y="834" text-anchor="middle" fill="#666">37</text><circle cx="450" cy="830" r="12" fill="#ddd"/><text x="450" y="834" text-anchor="middle" fill="#666">38</text>
    <text x="334" y="834" text-anchor="end">SPI1 MOSI</text><text x="486" y="834">I2S DIN</text>
    <circle cx="370" cy="870" r="12" fill="#444"/><text x="370" y="874" text-anchor="middle" fill="#fff">39</text><circle cx="450" cy="870" r="12" fill="#ddd"/><text x="450" y="874" text-anchor="middle" fill="#666">40</text>
    <text x="334" y="874" text-anchor="end" fill="#333">GND</text><text x="486" y="874">I2S DOUT</text>
  </g>

  <!-- how to find it -->
  <g font-size="14" fill="#222">
    <text x="30" y="940" font-weight="700">Finding it without seeing the markings:</text>
    <text x="30" y="962">Follow the servo board's I2C wires to the header: they are on pins 3 and 5. Pin 7 is the very next pin in the SAME row,</text>
    <text x="30" y="982">on the side away from pin 1 (pin 1 is at the end of the header; its pad is square). Don't use pin 2 or 4 (5 V) or 8 (UART).</text>
    <text x="30" y="1002" fill="#555">Other relay wires stay on the servo board: DC+ to V+ (5.19 V), DC- to GND; COM to OE, NC to VCC, NO to GND. Jumper on H.</text>
  </g>

  <!-- legend -->
  <g font-size="13">
    <circle cx="620" cy="110" r="8" fill="#18a84a"/><text x="634" y="115" fill="#222">relay IN</text>
    <circle cx="620" cy="134" r="8" fill="#2f6fd6"/><text x="634" y="139" fill="#222">servo board I2C (in use)</text>
    <circle cx="620" cy="158" r="8" fill="#444"/><text x="634" y="163" fill="#222">ground</text>
    <circle cx="620" cy="182" r="8" fill="#e0443e"/><text x="634" y="187" fill="#222">5 V</text>
    <circle cx="620" cy="206" r="8" fill="#f2a33a"/><text x="634" y="211" fill="#222">3.3 V</text>
  </g>
</svg>
