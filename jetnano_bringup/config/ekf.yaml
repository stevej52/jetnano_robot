# robot_localization: fuses visual odometry with the IMU and publishes the one
# transform the old URDF wrongly hard-coded:  odom -> base_link
#
# Nothing else may publish that transform. rtabmap's odometry node is launched
# with publish_tf:=false for exactly this reason - it supplies a measurement,
# the EKF owns the transform.
#
# map -> odom is still not ours. That comes from slam_toolbox or AMCL.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true              # ground vehicle: pin z, roll and pitch
    publish_tf: true
    publish_acceleration: false

    # The visual odometry carries the camera's frame time and arrives ~11 ms
    # later; the IMU stamps "now". So half of all VO messages are stamped
    # before the newest IMU sample the filter has already used, and without
    # this they are DISCARDED. On the bench enough VO survived to track. On
    # the first mapping drive (2026-09-24), under load, VO latency spiked to
    # 600 ms after a 0.75 s dropout, every VO sample was rejected for
    # seconds, and the filter coasted on the accelerometer: 6.5 km of "path"
    # in seven minutes, the SLAM map 4 km away, phantom camera obstacles
    # everywhere. With a second of history the filter rewinds and re-applies
    # late measurements instead.
    smooth_lagged_data: true
    history_length: 1.0

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint   # NOT base_link: the URDF roots at base_footprint,
                                      # so base_link already has a parent. Publishing
                                      # odom -> base_link would give it two, and a TF
                                      # tree with two parents silently stops resolving.
    world_frame: odom             # this EKF produces odom -> base_footprint only

    # Visual odometry from the RealSense D435, via rtabmap_odom.
    # Order: x y z, roll pitch yaw, vx vy vz, vroll vpitch vyaw, ax ay az
    odom0: vo
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # BNO055: yaw RATE only.
    imu0: imu/data
    # Not yaw itself: the visual odometry already supplies an absolute heading
    # in the odom frame, and a second absolute heading (the BNO055's
    # magnetometer, uncalibrated, and offset by the mount's yaw) made the
    # filter flip between the two, tens of degrees a second, with the robot
    # standing still (measured 2026-09-22).
    # Not acceleration either: it was meant to ride out short VO dropouts,
    # and instead it is what ran the filter away when VO was rejected
    # (2026-09-24, above) - the chip's "gravity-free" acceleration carries a
    # bias (~0.08 m/s2 measured) and integrates into a velocity that nothing
    # pulls back. A VO dropout now leaves the filter coasting at its last
    # velocity, which VO corrects on return.
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    # The bno055 driver's imu/data carries the chip's own gravity-free
    # linear acceleration (raw+gravity is on imu/imu_raw), so the EKF must
    # not subtract gravity a second time.
    imu0_remove_gravitational_acceleration: false

    # process_noise_covariance is a full 15x15 matrix (225 values). The
    # robot_localization defaults are sane; tune it only with real data, and
    # if you do, write out all 225 numbers - a short list is rejected.
