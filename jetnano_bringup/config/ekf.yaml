# robot_localization: fuses visual odometry with the IMU and publishes the one
# transform the old URDF wrongly hard-coded:  odom -> base_link
#
# Nothing else may publish that transform. rtabmap's odometry node is launched
# with publish_tf:=false for exactly this reason - it supplies a measurement,
# the EKF owns the transform.
#
# map -> odom is still not ours. That comes from slam_toolbox or AMCL.
ekf_filter_node:
  ros__parameters:
    # 100 Hz, the IMU's rate (was 30). Bench, composed Nav2 starting and stopping,
    # two runs each (2026-09-27): output spacing median 30.5 -> 10.1 ms, 1-in-1000
    # gap 103-112 -> 63-71 ms, time with the pose older than 50 ms 3.4-3.7 -> 1.8-2.2 s;
    # the rare 0.2-0.3 s stall is the same at both rates. Its "Failed to meet update
    # rate" warnings are more frequent at a 10 ms budget but are not staler output.
    # Costs ~11 % of a core parked (EKF +4, /tf listeners +7) and ~15 % more in Nav2.
    frequency: 100.0
    # Publish every cycle, the pose predicted to "now". Without it the output carries the
    # stamp of the last measurement used and a cycle with no new one publishes nothing:
    # the IMU's samples jitter (gaps 5-15 ms), ~10 % of cycles had none, and the output ran
    # 84-93/s with gaps to 21 ms. Shadow EKFs side by side on the live inputs (2026-09-29,
    # parked, 45 s): without -> 101/s, stamp gaps p99 15.3 ms, the newest pose p50 14.1 /
    # p99 21.0 ms old; with -> 101/s, gaps p99 10.6 ms, newest pose p50 5.9 / p99 11.1 ms
    # old, CPU 10.2 -> 10.7 % of a core. TF is then always there up to "now", so lookups at
    # a fresh sensor stamp don't wait for the next IMU sample.
    predict_to_current_time: true
    sensor_timeout: 0.2
    two_d_mode: true              # ground vehicle: pin z, roll and pitch
    publish_tf: true
    publish_acceleration: false

    # The visual odometry carries the camera's frame time and arrives ~11 ms
    # later; the IMU stamps "now". So half of all VO messages are stamped
    # before the newest IMU sample the filter has already used, and without
    # this they are DISCARDED. On the bench enough VO survived to track. On
    # the first mapping drive (2026-09-24), under load, VO latency spiked to
    # 600 ms after a 0.75 s dropout, every VO sample was rejected for
    # seconds, and the filter coasted on the accelerometer: 6.5 km of "path"
    # in seven minutes, the SLAM map 4 km away, phantom camera obstacles
    # everywhere. With a second of history the filter rewinds and re-applies
    # late measurements instead.
    smooth_lagged_data: true
    history_length: 1.0

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint   # NOT base_link: the URDF roots at base_footprint,
                                      # so base_link already has a parent. Publishing
                                      # odom -> base_link would give it two, and a TF
                                      # tree with two parents silently stops resolving.
    world_frame: odom             # this EKF produces odom -> base_footprint only

    # Visual odometry (cuVSLAM in the container, or rtabmap on the CPU).
    # Order: x y z, roll pitch yaw, vx vy vz, vroll vpitch vyaw, ax ay az
    #
    # VELOCITIES ONLY, not the pose. Every restart of the camera pipeline
    # (the watchdog does that when VO stalls) starts cuVSLAM's odometry from
    # zero at wherever the robot is; fused as an absolute pose, that snapped
    # the filter back to the origin at every restart - 7 jumps on the first
    # lap of 2026-09-24, and SLAM drew the house three times, rotated. Fed
    # velocities, the filter integrates straight through a restart.
    # Speed only, since 2026-09-29: not the yaw rate. It reads every turn 5.7 %
    # short (an hour of floor driving against SLAM, tools/drive_analysis/
    # heading_drift.py) and dragged the heading down with it; heading is the
    # BNO055's alone now (imu0 below).
    odom0: vo
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # While /vo is silent - and the lidar odometry below is silent too, or
    # not running - the VO watchdog (jetnano_watchdog safety_monitor, or
    # jetnano_bringup/vo_watchdog.py) publishes zero vx/vy here: the filter's
    # velocity decays to zero instead of coasting forever. Silent otherwise.
    odom1: odom_hold
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10

    # Lidar odometry (MOLA on /scan, lidar_odometry.launch.py; robot.launch.py
    # lidar_odom:=true). Speeds again, for the same reason as the camera's:
    # lidar_odom_relay differentiates MOLA's pose into vx, vy and yaw rate in
    # the robot's frame, so a MOLA restart cannot yank the pose. ~8 Hz. The relay
    # drops what cannot be real (sideways motion, impossible speed changes, and
    # the samples after each: MOLA loses track in episodes) and sets the
    # covariance from what got through on the recorded drives: +-0.03 m/s still,
    # +-0.10 moving (lidar_odom_relay velocity_sd_* / yaw_rate_sd_*). When the
    # camera goes quiet it carries the filter alone and the hold above stays
    # off; when it is not running this input is simply silent.
    odom2: lidar_odom
    # Forward and sideways speed only, not the yaw rate (2026-09-28). On the 19:32
    # drive of 2026-09-27 MOLA reported her spinning the wrong way (-3.4 rad/s while
    # the IMU read +1.2) for most of a minute and dragged the EKF's heading 70-140
    # degrees off the camera's; the relay's gates stop 89 % of such samples, not all.
    # The IMU's gyro gives the yaw rate 100 times a second to +-0.007 rad/s; what the
    # lidar adds is speed when the camera is gone.
    odom2_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom2_differential: false
    odom2_relative: false
    odom2_queue_size: 10

    # BNO055: its fused HEADING, relative to where she started, since 2026-09-29 - the
    # only heading input now. Until then this was the chip's raw yaw rate, with the
    # camera's: an hour of floor driving (3700 deg of turning) against SLAM, the
    # gyro read every turn 3.6 % short and the camera 5.7 %, the EKF ended 63 deg off
    # and odom had drifted 7.7 m / 72 deg from the map - which placed nvblox's older
    # obstacles in the wrong spots: ghost walls, and a planner that found no way home.
    # The chip's own fusion ended 12.4 deg off in the hour, scale right (0.998), 95 %
    # of 5-minute stretches within 5 deg (the EKF's: 40). tools/drive_analysis/.
    # imu/base, not imu/data: bno055_lean turns the chip's orientation into base_link
    # itself (the chip is mounted upside down and turned), so nothing here depends on
    # how the EKF would treat a mounted IMU's orientation.
    # Relative (the first reading is zero, so the odom frame starts where she stands),
    # NOT differential. The hour's sensors replayed through the filter on Rosie
    # (tools/drive_analysis: replay_heading_0929.sh, replay_compare.py; the old settings
    # replayed to +62.9 deg against the drive's +63.0, so the replay is faithful):
    #   differential (the first try)  -98.4 deg at the end, turns 10.3 % LONG - the filter
    #                                  rebuilds the heading from rates it estimates;
    #   relative                      +12.5 deg at the end, scale -0.13 %, 95 % of 5-minute
    #                                  spans within 5.0 deg - the chip's own accuracy.
    # The one absolute heading here: in 2026-09-22 two (VO's pose and the magnetometer)
    # made the filter flip between them, tens of degrees a second, standing still - VO
    # now gives speed only, so there is nothing for it to fight.
    # Not acceleration: it was meant to ride out short VO dropouts, and instead it
    # is what ran the filter away when VO was rejected (2026-09-24, above) - the
    # chip's "gravity-free" acceleration carries a bias (~0.08 m/s2 measured) and
    # integrates into a velocity that nothing pulls back.
    imu0: imu/base
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    # The bno055 driver's imu/data carries the chip's own gravity-free
    # linear acceleration (raw+gravity is on imu/imu_raw), so the EKF must
    # not subtract gravity a second time.
    imu0_remove_gravitational_acceleration: false

    # process_noise_covariance is a full 15x15 matrix (225 values). The
    # robot_localization defaults are sane; tune it only with real data, and
    # if you do, write out all 225 numbers - a short list is rejected.
