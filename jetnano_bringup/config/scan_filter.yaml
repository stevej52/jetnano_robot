# Takes the robot's own parts out of the lidar scan.
#
# The A1M8 sits 16 cm above base_link and sees the Wi-Fi antenna 25 cm away at
# 45 degrees to the front-left, every turn (measured 2026-09-23: three returns
# at (0.18, 0.18) in lidar_link, nothing else under 0.5 m). Left in, that point
# would trip the collision guard's slow zone on every forward command, sit in
# Nav2's costmap next to the robot wherever it goes, and be drawn into every
# map. The box is the body plus a few centimetres: anything the lidar returns
# from inside it is the robot, and becomes "no return".
#
# sensors.launch.py runs this between the driver and the rest of the system:
# the driver publishes scan_raw, this publishes scan.
scan_filter:
  ros__parameters:
    filter1:
      name: robot_body
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link
        # 2026-10-06 (drive 43): +-0.25 x +-0.20 hid a 5 cm strip all down her sides (her outline is
        # +-0.222 x +-0.148): a chair corner came in there unseen by the costmaps, the stop zones and
        # the guard, and her wheel shoved the chair (with Steve in it). The antenna no longer shows
        # (raw scan, 45 turns: nothing under 0.51 m), so the box now stays INSIDE her outline.
        min_x: -0.21
        max_x: 0.21
        min_y: -0.14
        max_y: 0.14
        min_z: -0.10
        max_z: 0.50
        invert: false
