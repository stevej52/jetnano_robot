# Channel configuration for THIS robot. Started life as rc_car.yaml in
# ros2_pca9685 and keeps its tuning, with one deliberate difference:
#
#   i2c_bus was 1, which is correct for a Jetson Nano.
#   On the Orin Nano under JetPack 7, 40-pin header pins 3/5 are a different
#   bus. Confirm with:   i2cdetect -l   and   i2cdetect -y -r 7
#   looking for address 40. Set i2c_bus to whichever bus shows it.
/**:
  ros__parameters:
    i2c_bus: 7                 # MEASURE ME - was 1 on the Jetson Nano
    i2c_address: 64            # 0x40
    pwm_frequency: 100.0
    twist_topic: cmd_vel
    channels: [throttle, steering, rear_steering]

    # Publish servo positions as joint_states. Left off for now: the driver
    # reports servo-horn degrees (85 deg = straight), which is not the same
    # thing as wheel steer angle, so feeding it straight into the URDF would
    # draw the wheels wrong. Turn on once the linkage is calibrated.
    joint_state_publish_rate: 0.0

    throttle:
      channel: 0
      type: continuous
      # Bench-measured 2026-09-21 on the real ESC, wheels up. This ESC runs the
      # OPPOSITE of RC convention: neutral is 1375 us (1500 drives it backward),
      # SHORTER pulses go forward, longer go backward. The pulse limits are the
      # ESC's own endpoints, found by driving it: forward speed PEAKS at
      # ~1292 us and falls off again by 1250 (past its calibration), so 1292
      # is full forward - only ~80 us of forward travel exists. Backward keeps
      # gaining to ~1750 ("turbo"); capped at 1650 here on purpose.
      #
      # That asymmetry (narrow forward, wide backward) is the signature of an
      # RC ESC whose 50%-limited REVERSE is wired as the robot's forward. The
      # robot therefore has more speed backward than forward. Swapping two
      # motor wires would flip that; if you ever do, negate linear_x below and
      # swap forward_start/reverse_start.
      min_pulse_us: 1292.0
      neutral_pulse_us: 1375.0
      max_pulse_us: 1650.0
      min_limit: -1.0          # robot forward: all the ESC has (1292 us)
      # Robot backward is capped so it is no faster than forward - a rock
      # crawler wants torque, not speed, and full reverse (1650+) is quicker
      # than the ESC's forward side can ever be. 0.6 of the way to 1650 is
      # 1540 us, matched to forward's top speed by eye. Raise toward 1.0 for
      # more reverse; lower it if backward still outruns forward.
      max_limit: 0.6
      home: 0.0
      timeout: 0.5             # back to neutral if commands stop
      twist:
        linear_x: -1.0         # forward = shorter pulse on this ESC (measured)
      esc:
        arming:
          values: [0.0]
          durations: [2.0]
        deadband: 0.02
        # Where the motor actually starts moving, as a fraction of each side's
        # travel. The driver names sides by PULSE direction: its "reverse" is
        # toward min_pulse_us, which with linear_x -1.0 is the ROBOT'S FORWARD.
        # Measured: nothing moves within ~25 us of neutral either way, which
        # is 25/83 of the short forward side and 25/275 of the long back side.
        reverse_start: 0.30    # robot forward (short pulses) starts here
        forward_start: 0.09    # robot backward (long pulses) starts here

    steering:
      channel: 1
      home: 84.0               # measured: dead straight
      home_on_start: true
      min_limit: 40.0          # measured: 45 reaches cleanly, no binding
      max_limit: 125.0         # measured: 120 reaches cleanly, no binding
      timeout: 0.5
      joint: front_left_steer_joint
      twist:
        angular_z: -18.33

    rear_steering:
      channel: 2
      home: 84.0               # mirrored about the front centre: rear = 168 - front
      home_on_start: true
      min_limit: 43.0
      max_limit: 128.0
      timeout: 0.5
      joint: rear_left_steer_joint
      twist:
        angular_z: 18.33       # opposite sign: four-wheel steering
