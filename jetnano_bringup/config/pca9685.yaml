# Channel configuration for THIS robot. Started life as rc_car.yaml in
# ros2_pca9685 and keeps its tuning, with one deliberate difference:
#
#   i2c_bus was 1, which is correct for a Jetson Nano.
#   On the Orin Nano under JetPack 7, 40-pin header pins 3/5 are a different
#   bus. Confirm with:   i2cdetect -l   and   i2cdetect -y -r 7
#   looking for address 40. Set i2c_bus to whichever bus shows it.
/**:
  ros__parameters:
    i2c_bus: 7                 # MEASURE ME - was 1 on the Jetson Nano
    i2c_address: 64            # 0x40
    pwm_frequency: 100.0
    twist_topic: cmd_vel
    channels: [throttle, steering, rear_steering]

    # Publish servo positions as joint_states. Left off for now: the driver
    # reports servo-horn degrees (85 deg = straight), which is not the same
    # thing as wheel steer angle, so feeding it straight into the URDF would
    # draw the wheels wrong. Turn on once the linkage is calibrated.
    joint_state_publish_rate: 0.0

    throttle:
      channel: 0
      type: continuous
      # Bench-calibrated 2026-09-21 on the real ESC, wheels up, by stepping the
      # pulse 20 us at a time and having the owner rate speed out of 10:
      #   forward  1292:2  1272:4  1252:6  1232:8  1212:9  1192:10  1172:11
      #   reverse  1514:3  1530:4  1550:5  1570:7  1595:8  1625:8   1665:8
      # This ESC runs the OPPOSITE of RC convention: neutral is 1375 us (1500
      # drives it backward), SHORTER pulses go forward. Forward is the
      # full-power side; reverse plateaus around 1600 - a limited reverse,
      # which is the right way round for a crawler. Nothing moves within
      # ~25 us of neutral either way.
      # The 2021 code stopped at 1250 / 1583 (ServoKit 60 / 100 deg); the
      # ESC has more than that on both sides, so the range is now what it
      # actually does. Pull max_pulse_us in toward 1600 if you want the
      # reverse stick's top quarter to do something.
      min_pulse_us: 1172.0     # robot full forward ("11 out of 10")
      neutral_pulse_us: 1375.0
      max_pulse_us: 1665.0     # robot full reverse (speed plateaus from ~1600)
      min_limit: -1.0
      max_limit: 1.0
      home: 0.0
      timeout: 0.5             # back to neutral if commands stop
      twist:
        linear_x: -1.0         # forward = shorter pulse on this ESC (measured)
      esc:
        arming:
          values: [0.0]
          durations: [2.0]
        deadband: 0.02
        # Where the motor actually starts moving, as a fraction of each side's
        # travel: ~25 us either side of neutral. The driver names sides by
        # PULSE direction - its "reverse" is toward min_pulse_us, which with
        # linear_x -1.0 is the ROBOT'S FORWARD.
        reverse_start: 0.12    # robot forward: 25 / (1375 - 1172)
        forward_start: 0.09    # robot backward: 25 / (1665 - 1375)

    steering:
      channel: 1
      home: 84.0               # measured: dead straight
      home_on_start: true
      min_limit: 40.0          # measured: 45 reaches cleanly, no binding
      max_limit: 125.0         # measured: 120 reaches cleanly, no binding
      timeout: 0.5
      joint: front_left_steer_joint
      twist:
        angular_z: -18.33

    rear_steering:
      channel: 2
      home: 84.0               # mirrored about the front centre: rear = 168 - front
      home_on_start: true
      min_limit: 43.0
      max_limit: 128.0
      timeout: 0.5
      joint: rear_left_steer_joint
      twist:
        angular_z: 18.33       # opposite sign: four-wheel steering
