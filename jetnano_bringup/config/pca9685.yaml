# Channel configuration for THIS robot. Started life as rc_car.yaml in
# ros2_pca9685 and keeps its tuning, with one deliberate difference:
#
#   i2c_bus was 1, which is correct for a Jetson Nano.
#   On the Orin Nano under JetPack 7, 40-pin header pins 3/5 are a different
#   bus. Confirm with:   i2cdetect -l   and   i2cdetect -y -r 7
#   looking for address 40. Set i2c_bus to whichever bus shows it.
/**:
  ros__parameters:
    i2c_bus: 7                 # MEASURE ME - was 1 on the Jetson Nano
    i2c_address: 64            # 0x40
    pwm_frequency: 100.0
    twist_topic: cmd_vel
    channels: [throttle, steering, rear_steering]

    # Publish servo positions as joint_states. Left off for now: the driver
    # reports servo-horn degrees (85 deg = straight), which is not the same
    # thing as wheel steer angle, so feeding it straight into the URDF would
    # draw the wheels wrong. Turn on once the linkage is calibrated.
    joint_state_publish_rate: 0.0

    throttle:
      channel: 0
      type: continuous
      # The 2021 joystick mapping, recovered from nanoserverlite.py and the
      # PC-side senders, reproduced exactly - it was driven for hours and is
      # more trustworthy than ranking free-spinning wheels by eye. That chain
      # was LINEAR with no deadzone and no curve: stick -> servo degrees on
      # ServoKit defaults (750-2250 us over 180 deg) at 100 Hz, throttle
      # neutral 75 deg with full forward 60 and full back 100.
      #
      # This ESC runs the OPPOSITE of RC convention: neutral is 1375 us (1500
      # drives it backward), SHORTER pulses go forward. Bench-confirmed.
      # Forward travel is the short side (125 us) and back the long side
      # (208 us), so the robot is quicker backward than forward - that is how
      # it was tuned; it is a crawler. Cap max_limit below 1.0 to change that.
      min_pulse_us: 1250.0     # 60 deg: full forward, as the joystick drove it
      neutral_pulse_us: 1375.0 # 75 deg
      max_pulse_us: 1583.0     # 100 deg: full back
      min_limit: -1.0
      max_limit: 1.0
      home: 0.0
      timeout: 0.5             # back to neutral if commands stop
      twist:
        linear_x: -1.0         # forward = shorter pulse on this ESC (measured)
      esc:
        arming:
          values: [0.0]
          durations: [2.0]
        deadband: 0.02
        # No start offsets: the 2021 chain had none, and the ESC's own dead
        # zone (~25 us either side of neutral) is small enough to leave to it.
        forward_start: 0.0
        reverse_start: 0.0

    steering:
      channel: 1
      home: 84.0               # measured: dead straight
      home_on_start: true
      min_limit: 40.0          # measured: 45 reaches cleanly, no binding
      max_limit: 125.0         # measured: 120 reaches cleanly, no binding
      timeout: 0.5
      joint: front_left_steer_joint
      twist:
        angular_z: -18.33

    rear_steering:
      channel: 2
      home: 84.0               # mirrored about the front centre: rear = 168 - front
      home_on_start: true
      min_limit: 43.0
      max_limit: 128.0
      timeout: 0.5
      joint: rear_left_steer_joint
      twist:
        angular_z: 18.33       # opposite sign: four-wheel steering
