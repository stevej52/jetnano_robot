[Login]
# The robot runs as a normal user from systemd, outside any login session. With
# logind's default RemoveIPC=yes, the user's POSIX shared memory (/dev/shm) is
# deleted the moment their last SSH session ends - and that shared memory is
# Fast DDS's transport between nodes on the same machine. Every node on the
# robot then went deaf to every other node at each logout, while the network
# path to the host PC kept working (2026-09-23). Install with:
#
#     sudo cp logind-removeipc.conf /etc/systemd/logind.conf.d/
#     sudo systemctl restart systemd-logind
RemoveIPC=no
